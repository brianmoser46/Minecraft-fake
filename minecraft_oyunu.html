<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Mini Minecraft - Köy ve Hayvanlar</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 12px;
            height: 12px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
            pointer-events: none;
        }
        #instructions {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid #4CAF50;
            max-width: 400px;
        }
        #instructions h1 {
            margin-top: 0;
            color: #4CAF50;
        }
        #instructions p {
            line-height: 1.5;
            color: #ddd;
            font-size: 14px;
        }
        .btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
        }

        /* PUBG Tarzı Joystick ve Kontroller */
        #joystick-zone {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 130px;
            height: 130px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            z-index: 20;
            touch-action: none;
            backdrop-filter: blur(4px);
        }
        #joystick-knob {
            position: absolute;
            top: 40px;
            left: 40px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.6);
            border: 2px solid white;
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        #action-zone {
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 20;
            display: flex;
            gap: 15px;
            align-items: flex-end;
        }
        .mob-action-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(76, 175, 80, 0.7);
            border: 3px solid rgba(255, 255, 255, 0.9);
            color: white;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            cursor: pointer;
            user-select: none;
            touch-action: none;
        }
        .mob-action-btn:active {
            transform: scale(0.95);
        }
        #btn-break { background: rgba(231, 76, 60, 0.7); }

        /* Sağ Ekran Kamera Alanı */
        #look-touch-area {
            position: absolute;
            top: 0;
            right: 0;
            width: 55vw;
            height: 100vh;
            z-index: 15;
            touch-action: none;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="crosshair"></div>
    <div id="hud">Blok: Toprak | İnek, Koyun, Domuz ve Köy</div>
    <div id="look-touch-area"></div>

    <!-- Başlangıç Ekranı -->
    <div id="instructions">
        <h1>Mini Minecraft</h1>
        <p><b>Sol Joystick:</b> Hareket et.<br><b>Sağ Ekran:</b> Kamera ile etrafa bak.<br><b>Zıpla Butonu:</b> Zıpla.<br><b>Kır Butonu:</b> Bakılan bloğu kır!<br><br>Köyde doğdun; ağaçlar, inek, domuz ve koyunlar seni bekliyor!</p>
        <button class="btn" id="start-btn">OYUNA BAŞLA</button>
    </div>

    <!-- PUBG Tarzı Kontroller -->
    <div id="joystick-zone">
        <div id="joystick-knob"></div>
    </div>
    <div id="action-zone">
        <div class="mob-action-btn" id="btn-break">KIR</div>
        <div class="mob-action-btn" id="btn-jump">ZIPLA</div>
    </div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer;
        let blocks = [];
        let animals = [];
        let gameStarted = false;

        let player = {
            x: 0, y: 3, z: 0,
            vx: 0, vy: 0, vz: 0,
            speed: 0.1,
            jumpForce: 0.2,
            gravity: 0.01,
            onGround: false,
            height: 1.8,
            radius: 0.5
        };

        let joystickMove = { x: 0, y: 0 };
        let euler = new THREE.Euler(0, 0, 0, 'YXZ');
        const PI_2 = Math.PI / 2;

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.FogExp2(0x87CEEB, 0.015);

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(player.x, player.y + player.height/2, player.z);

            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // Işıklar
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(40, 60, 40);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // Dünyayı Oluştur (Köy, Ağaçlar, Bloklar, Hayvanlar)
            buildMinecraftWorld();

            window.addEventListener('resize', onWindowResize);

            document.getElementById('start-btn').addEventListener('click', () => {
                document.getElementById('instructions').style.display = 'none';
                gameStarted = true;
            });

            setupJoystick();
            setupTouchLook();

            document.getElementById('btn-jump').addEventListener('click', () => {
                if (player.onGround) {
                    player.vy = player.jumpForce;
                    player.onGround = false;
                }
            });

            document.getElementById('btn-break').addEventListener('click', breakTargetBlock);

            animate();
        }

        // --- DÜNYA İNŞASI (Minecraft Tarzı) ---
        function createBlock(x, y, z, color) {
            const geometry = new THREE.BoxGeometry(2, 2, 2);
            const material = new THREE.MeshStandardMaterial({ color: color, roughness: 0.9 });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);

            let blockData = {
                mesh: mesh,
                x: x, y: y, z: z,
                minX: x - 1, maxX: x + 1,
                minY: y - 1, maxY: y + 1,
                minZ: z - 1, maxZ: z + 1
            };
            blocks.push(blockData);
            return blockData;
        }

        function createTree(x, z) {
            // Gövde (Odun Kahverengi)
            for (let y = 1; y <= 5; y += 2) {
                createBlock(x, y, z, 0x8B5A2B);
            }
            // Yapraklar (Yeşil)
            for (let dx = -2; dx <= 2; dx += 2) {
                for (let dz = -2; dz <= 2; dz += 2) {
                    for (let dy = 5; dy <= 7; dy += 2) {
                        if (Math.abs(dx) !== 2 || Math.abs(dz) !== 2 || dy !== 7) {
                            createBlock(x + dx, dy, z + dz, 0x2E8B57);
                        }
                    }
                }
            }
        }

        function createHouse(startX, startZ) {
            // Basit Köy Evi (Ahşap duvarlar, taş taban)
            for (let x = startX - 3; x <= startX + 3; x += 2) {
                for (let z = startZ - 3; z <= startZ + 3; z += 2) {
                    if (x === startX - 3 || x === startX + 3 || z === startZ - 3 || z === startZ + 3) {
                        createBlock(x, 1, z, 0xA0522D);
                        createBlock(x, 3, z, 0xA0522D);
                    }
                }
            }
            // Çatı
            for (let x = startX - 3; x <= startX + 3; x += 2) {
                for (let z = startZ - 3; z <= startZ + 3; z += 2) {
                    createBlock(x, 5, z, 0x8B0000);
                }
            }
        }

        function createAnimal(x, z, type) {
            let bodyColor = 0xffffff;
            let sizeX = 1.6, sizeY = 1.2, sizeZ = 1.0;

            if (type === 'cow') { bodyColor = 0x333333; } // Siyah-beyek inek tonu
            else if (type === 'pig') { bodyColor = 0xFFC0CB; sizeX = 1.2; sizeZ = 0.8; } // Pembe domuz
            else if (type === 'sheep') { bodyColor = 0xF5F5F5; } // Beyaz koyun

            const group = new THREE.Group();
            const geo = new THREE.BoxGeometry(sizeX, sizeY, sizeZ);
            const mat = new THREE.MeshStandardMaterial({ color: bodyColor, roughness: 0.8 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.y = sizeY / 2;
            mesh.castShadow = true;
            group.add(mesh);

            // Baş
            const headGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
            const headMesh = new THREE.Mesh(headGeo, mat);
            headMesh.position.set(sizeX/2 + 0.3, sizeY/2 + 0.2, 0);
            group.add(headMesh);

            group.position.set(x, 1, z);
            scene.add(group);
            animals.push({ group: group, baseZ: z, wanderSpeed: 0.02, dir: 1 });
        }

        function buildMinecraftWorld() {
            // Zemin Çim Blokları
            for (let x = -30; x <= 30; x += 2) {
                for (let z = -30; z <= 30; z += 2) {
                    createBlock(x, -1, z, 0x557A46); // Çim
                    createBlock(x, -3, z, 0x8B5A2B); // Toprak
                }
            }

            // Köy Evleri
            createHouse(-10, -10);
            createHouse(10, -15);

            // Ağaçlar
            createTree(-12, 5);
            createTree(12, 8);
            createTree(-6, -20);
            createTree(15, -5);

            // Hayvanlar (İnek, Koyun, Domuz)
            createAnimal(4, 4, 'cow');
            createAnimal(-5, 8, 'sheep');
            createAnimal(8, -4, 'pig');
            createAnimal(-8, -5, 'cow');
        }

        // --- BLOK KIRMA SİSTEMİ ---
        function breakTargetBlock() {
            // Kameranın baktığı yönde ilk bloğu bul ve yok et
            let dir = new THREE.Vector3();
            camera.getWorldDirection(dir);

            for (let i = blocks.length - 1; i >= 0; i--) {
                let b = blocks[i];
                let bPos = new THREE.Vector3(b.x, b.y, b.z);
                let dist = camera.position.distanceTo(bPos);
                if (dist < 6) {
                    // Blok kameranın önündeyse sil
                    scene.remove(b.mesh);
                    blocks.splice(i, 1);
                    break;
                }
            }
        }

        // --- KONTROLLER ---
        function setupJoystick() {
            const zone = document.getElementById('joystick-zone');
            const knob = document.getElementById('joystick-knob');
            let touchId = null;
            let center = { x: 0, y: 0 };
            const maxDist = 40;

            zone.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (touchId === null) {
                    let touch = e.changedTouches[0];
                    touchId = touch.identifier;
                    let rect = zone.getBoundingClientRect();
                    center.x = rect.left + rect.width / 2;
                    center.y = rect.top + rect.height / 2;
                }
            }, {passive: false});

            zone.addEventListener('touchmove', (e) => {
                e.preventDefault();
                for (let i = 0; i < e.changedTouches.length; i++) {
                    let touch = e.changedTouches[i];
                    if (touch.identifier === touchId) {
                        let dx = touch.clientX - center.x;
                        let dy = touch.clientY - center.y;
                        let dist = Math.hypot(dx, dy);
                        if (dist > maxDist) {
                            dx = (dx / dist) * maxDist;
                            dy = (dy / dist) * maxDist;
                        }
                        knob.style.transform = `translate(${dx}px, ${dy}px)`;
                        joystickMove.x = dx / maxDist;
                        joystickMove.y = dy / maxDist;
                    }
                }
            }, {passive: false});

            const endHandler = (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === touchId) {
                        touchId = null;
                        knob.style.transform = `translate(0px, 0px)`;
                        joystickMove.x = 0;
                        joystickMove.y = 0;
                    }
                }
            };
            zone.addEventListener('touchend', endHandler);
            zone.addEventListener('touchcancel', endHandler);
        }

        function setupTouchLook() {
            const lookArea = document.getElementById('look-touch-area');
            let touchId = null;
            let lastX = 0, lastY = 0;

            lookArea.addEventListener('touchstart', (e) => {
                if (touchId === null) {
                    let touch = e.changedTouches[0];
                    touchId = touch.identifier;
                    lastX = touch.clientX;
                    lastY = touch.clientY;
                }
            });

            lookArea.addEventListener('touchmove', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    let touch = e.changedTouches[i];
                    if (touch.identifier === touchId) {
                        let deltaX = touch.clientX - lastX;
                        let deltaY = touch.clientY - lastY;
                        lastX = touch.clientX;
                        lastY = touch.clientY;

                        euler.y -= deltaX * 0.005;
                        euler.x -= deltaY * 0.005;
                        euler.x = Math.max(-PI_2, Math.min(PI_2, euler.x));
                        camera.quaternion.setFromEuler(euler);
                    }
                }
            });

            const endHandler = (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === touchId) {
                        touchId = null;
                    }
                }
            };
            lookArea.addEventListener('touchend', endHandler);
            lookArea.addEventListener('touchcancel', endHandler);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (gameStarted) {
                // Oyuncu Hareketi
                if (Math.abs(joystickMove.x) > 0.1 || Math.abs(joystickMove.y) > 0.1) {
                    let dir = new THREE.Vector3();
                    camera.getWorldDirection(dir);
                    dir.y = 0;
                    dir.normalize();
                    let sideDir = new THREE.Vector3(-dir.z, 0, dir.x);

                    let moveVector = new THREE.Vector3(0, 0, 0);
                    moveVector.add(dir.clone().multiplyScalar(-joystickMove.y));
                    moveVector.add(sideDir.clone().multiplyScalar(joystickMove.x));
                    moveVector.normalize();

                    player.x += moveVector.x * player.speed;
                    player.z += moveVector.z * player.speed;
                }

                // Yerçekimi & Fizik
                player.vy -= player.gravity;
                player.y += player.vy;

                player.onGround = false;
                blocks.forEach(b => {
                    if (player.x + player.radius > b.minX && player.x - player.radius < b.maxX &&
                        player.z + player.radius > b.minZ && player.z - player.radius < b.maxZ) {
                        let topY = b.maxY + player.height/2;
                        if (player.y <= topY && player.y >= topY - 0.6 && player.vy <= 0) {
                            player.y = topY;
                            player.vy = 0;
                            player.onGround = true;
                        }
                    }
                });

                camera.position.set(player.x, player.y + player.height/2, player.z);

                // Hayvanların basit hareketleri
                animals.forEach(anim => {
                    anim.group.position.x += anim.wanderSpeed * anim.dir;
                    if (Math.abs(anim.group.position.x - 0) > 15) anim.dir *= -1;
                });
            }

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
